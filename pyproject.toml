[project]
name = "neurocache-openenv"
version = "3.0.0"
description = "LLM Memory Optimizer — DevOps Decision System"
authors = [
    { name = "Pavan" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "python-dotenv",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
